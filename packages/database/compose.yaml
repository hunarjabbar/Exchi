services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wholesale_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wholesale_test"]
      interval: 3s
      timeout: 3s
      retries: 20
