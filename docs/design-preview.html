function dashboard(r){let sup=S.role==='supplier';return head(r,tr('A consolidated view of operations, working capital and risk.','عرض موحد للعمليات ورأس المال والمخاطر.','بینینی یەکگرتووی کار و سەرمایە و مەترسی.'),btn(t('export'),'export','','download'))+`<div class="grid metrics">${[metric(tr('Gross merchandise value','إجمالي قيمة البضائع','کۆی بەهای کاڵا'),sup?'420M':'1.84B','IQD · sample period','chart'),metric(tr('Collected cash','النقد المحصل','پارەی کۆکراوە'),sup?'318M':'1.52B','IQD · sample period','wallet'),metric(tr('Outstanding receivables','الذمم المدينة','پارەی ماوە'),sup?'76M':'284M','IQD · sample balance','file'),metric(tr('Order fill rate','معدل تنفيذ الطلبات','ڕێژەی دابینکردن'),'96.2%','Sample only','box')].join('')}</div><div class="grid dashboardgrid"><section class="card">${cardhead(tr('Commercial activity','النشاط التجاري','چالاکی بازرگانی'),tr('June–November · illustrative','يونيو–نوفمبر · توضيحي','حوزەیران–تشرینی دووەم · نموونە'))}${chart()}<div class="legend"><span><i class="dot" style="background:#167D73"></i>GMV</span><span><i class="dot" style="background:#A7D7C7"></i>Collections</span></div></section><section class="card">${cardhead(tr('Action queue','قائمة الإجراءات','ڕیزی کردارەکان'),tr('Requires operator review','يتطلب المراجعة','پێویستی بە پێداچوونەوەیە'))}<div class="queue">${(sup?[['Orders to fulfill','Supplier sample',2,'box','/supplier/orders'],['Stock review','Supplier sample',1,'box','/supplier/inventory']]:[['KYC review','Identity evidence',12,'shield','/command/compliance/kyc'],['Pending approvals','Independent review',8,'check','/command/approvals'],['COD exceptions','Cash variance review',3,'wallet','/command/finance/cod'],['Expiry alerts','Batch review',6,'box','/command/inventory']]).map(a=>`<button class="queueitem" data-action="${'go:'+a[4]}"><span class="queueicon">${I(a[3])}</span><span>${a[0]}<small>${a[1]}</small></span><span class="count">${a[2]}</span>${I('chev')}</button>`).join('')}</div></section></div>${ordersTable()}`}
function toolbar(statuses=['Active','Pending','Draft','Archived','Disabled']){return `<div class="toolbar"><input id="filter" type="search" aria-label="Filter records" placeholder="${t('search')}" value="${esc(S.filter)}"><select id="status" aria-label="Filter status"><option value="All">${t('all')}</option>${statuses.map(s=>`<option value="${esc(s)}" ${S.status===s?'selected':''}>${esc(L(s))}</option>`).join('')}</select>${btn(t('export'),'export','','download')}</div>`}
function generic(r){const base={id:'DEMO-001',values:r.sample.length?r.sample:['Demo record','Draft']};let rows=[base,...(S.edits[r.path]||[])].map(x=>({...x,values:[...x.values]}));rows=rows.map(x=>{if(S.archived[r.path+'|'+x.id])x.values[x.values.length-1]='Archived';return x}).filter(x=>x.values.join(' ').toLowerCase().includes(S.filter.toLowerCase())&&(S.status==='All'||x.values.includes(S.status)));const fields=r.fields.length?r.fields:['Reference','Status'];return head(r,`Workspace contract · ${r.resource||'Scoped records'} · ${tr('demo data only','بيانات تجريبية فقط','تەنها داتای نموونە')}`,r.mutable?btn(t('new'),'create','primary','plus'):btn(t('locked'),'locked','','lock'))+`<section class="card tablecard">${cardhead(title(r),'Scoped records · revision-aware')}${toolbar()}<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f)}</th>`).join('')}<th>Revision</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr>${x.values.map((v,i)=>`<td>${i===x.values.length-1?pill(v):esc(v)}</td>`).join('')}<td>${x.version||1}</td><td>${btn(t('details'),'generic:'+x.id,'quiet')}</td></tr>`).join('')}</tbody></table>${!rows.length?`<div class="empty">${t('no')}</div>`:''}</div><div class="tablefoot">${num(rows.length)} records <span>${r.mutable?'Local draft CRUD only':'Protected transaction · no write'}</span></div></section><div class="notice">${I('lock')} Authorization, tenant scope, optimistic revision and server-side validation are required in production. No backend calls are made by this prototype.</div>`}

function retailhome(r){return `<section class="hero"><div><div class="eyebrow">${tr('Procurement workspace','مساحة المشتريات','شوێنی کار بۆ کڕین')}</div><h1>${tr('Restock with confidence.','جدّد مخزونك بثقة.','بە دڵنیایی کۆگاکەت نوێ بکەرەوە.')}</h1><p>${tr('Order wholesale inventory, compare packaging and manage deliveries in one place.','اطلب مخزون الجملة وقارن العبوات وأدر التوصيل في مكان واحد.','کاڵای کۆفرۆشی داوا بکە و گەیاندن بەڕێوە ببە.')}</p>${btn(tr('Start quick order','ابدأ طلباً سريعاً','داوای خێرا دەست پێ بکە'),'go:/app/quick-order','','cart')}</div>${heroart()}</section><div class="grid quickgrid">${[['catalog','box'],['quick-order','grid'],['scan','scan'],['orders','file'],['credit','wallet'],['sync','sync']].map(a=>{let rr=ROUTES.find(z=>z.path==='/app/'+a[0]);return `<a class="card quicklink" href="#${rr.path}">${I(a[1],26)}<strong>${title(rr)}</strong><small>${tr('Open workspace','فتح المساحة','کردنەوەی شوێنی کار')}</small></a>`}).join('')}</div>${ordersTable()}`}
function publicHome(r){return `<section class="hero"><div><div class="eyebrow">IRAQ / WHOLESALE</div><h1>${tr('A better way to buy in bulk.','طريقة أفضل للشراء بالجملة.','ڕێگایەکی باشتر بۆ کڕینی کۆ.')}</h1><p>${tr('Verified retail procurement and supplier distribution across Iraq and Kurdistan.','مشتريات موثقة وتوزيع في العراق وإقليم كردستان.','کڕین و دابەشکردنی پشتڕاستکراو لە عێراق و کوردستان.')}</p>${btn(tr('Register your shop','سجّل متجرك','فرۆشگاکەت تۆمار بکە'),'go:/public/register','','plus')}</div>${heroart()}</section><div class="grid quickgrid"><a class="card quicklink" href="#/public/catalog">${I('box',26)}<strong>${tr('Preview catalog','معاينة المنتجات','پێشبینینی کاڵا')}</strong><small>${t('preview')}</small></a><a class="card quicklink" href="#/public/register">${I('shield',26)}<strong>${tr('Get verified','احصل على التحقق','پشتڕاستکردنەوە')}</strong><small>Four-stage KYC</small></a></div>`}
function shop(r){let locked=S.role==='public'||!S.verified;let items=PRODUCTS.filter(p=>searchProduct(p,S.filter));return head(r,tr('Select products and packaging for bulk procurement.','اختر المنتجات والعبوات للشراء بالجملة.','کاڵا و پاکەت بۆ کڕینی کۆ هەڵبژێرە.'),locked?'':btn(`${t('cart')} (${Object.values(S.cart).filter(q=>q>0).length})`,'go:/app/cart','','cart'))+`<div class="actions" style="margin-bottom:14px"><input id="filter" aria-label="Product search" type="search" placeholder="SKU / brand / باركود / بارکۆد" value="${esc(S.filter)}" style="flex:1"><button data-action="verifytoggle">${locked?'KYC preview':'Verified sample'}</button></div><div class="grid productgrid">${items.map(p=>`<article class="card product"><div class="visual">${I('box',48)}</div><div class="demo-tag">${p.sku} · ${p.brand}</div><h3>${esc(tr(...p.name))}</h3><div class="meta"><small>${p.uom}</small>${p.bonus?pill('10 + 1 bonus'):''}</div><div class="price">${locked?I('lock')+' '+t('preview'):money(p.price)}</div><small>MOQ ${p.moq} · ${p.stock} available (sample)</small>${locked?`<button disabled>${t('locked')}</button>`:btn(tr('Add minimum quantity','أضف الحد الأدنى','کەمترین بڕ زیاد بکە'),'add:'+p.sku,'primary','plus')}</article>`).join('')}</div>${items.length?'':`<div class="empty">${t('no')}</div>`}`}
function calc(){let lines=PRODUCTS.filter(p=>S.cart[p.sku]>0).map(p=>({...p,q:S.cart[p.sku],free:p.bonus?Math.floor(S.cart[p.sku]/10):0}));return {lines,total:lines.reduce((a,p)=>a+p.q*p.price,0),valid:lines.length>0&&lines.every(p=>p.q>=p.moq&&p.q+p.free<=p.stock&&Number.isInteger(p.q))}}
function qty(p){return `<input class="qty" type="number" aria-label="Quantity ${p.sku}" min="0" max="10000" step="1" data-qty="${p.sku}" value="${S.cart[p.sku]||0}">`}
function quick(r){const {total,valid}=calc();return head(r,'Enter carton quantities, review MOQ and bonus stock. '+(S.role==='field'?'Proxy order requires retailer delegation.':''),btn(S.offline?t('offline'):t('online'),'offline','','sync'))+`<div class="split"><section class="card tablecard">${cardhead('Bulk order matrix','Sample rows · paste SKU and quantity using import field below') }<div class="tablewrap"><table><thead><tr><th>SKU / product</th><th>UOM</th><th>MOQ</th><th>${t('qty')}</th><th>Bonus</th><th>Subtotal</th></tr></thead><tbody>${PRODUCTS.map(p=>{let q=S.cart[p.sku]||0;return `<tr><td><strong>${p.sku}</strong><span class="sub">${esc(tr(...p.name))}</span></td><td>${p.uom}</td><td>${p.moq}</td><td>${qty(p)}${q>0&&q<p.moq?'<span class="sub" style="color:var(--danger)">Below MOQ</span>':''}</td><td>${p.bonus?Math.floor(q/10):0}</td><td>${money(q*p.price)}</td></tr>`}).join('')}</tbody></table></div></section><section class="card"><h2>Order draft</h2><div class="detailrow"><span>Items</span><strong>${calc().lines.length}</strong></div><div class="detailrow"><span>Subtotal</span><strong>${money(total)}</strong></div><p class="notice">${S.offline?'Offline: price and stock snapshots only. Server requote required.':'Current quotation and stock must be validated on the server.'}</p><div class="field"><label for="paste">Paste SKU / quantity (tab separated)</label><textarea id="paste" rows="3" placeholder="BEV-001&#9;20"></textarea></div>${btn('Apply pasted quantities','paste')}${S.role==='field'?`<p class="notice">Delegation not verified. Queue draft only.</p>${btn('Queue proxy draft','queue','primary')}`:`<button class="primary" data-action="${S.offline?'queue':'go:/app/cart'}" ${!valid?'disabled':''}>${S.offline?'Queue draft':'Review cart'}</button>`}</section></div>`}
function cart(r){let {lines,total,valid}=calc();return head(r,'Review paid quantities, bonus units and MOQ before checkout.')+`<div class="split"><section class="card tablecard">${cardhead('Your draft order','Synthetic order · not submitted')}<div class="tablewrap"><table><thead><tr><th>Product</th><th>Quantity</th><th>Bonus</th><th>Amount</th></tr></thead><tbody>${lines.map(p=>`<tr><td>${esc(tr(...p.name))}<span class="sub">${p.sku}</span></td><td>${qty(p)}</td><td>${p.free}</td><td>${money(p.q*p.price)}</td></tr>`).join('')}</tbody></table>${!lines.length?'<div class="empty">Cart is empty. Add products in Quick order.</div>':''}</div></section><section class="card"><h2>Order summary</h2><div class="detailrow"><span>Subtotal</span><strong>${money(total)}</strong></div><div class="notice">Tax, shipping, FX and final totals require a server quotation.</div><button class="primary" data-action="go:/app/checkout" ${!valid?'disabled':''}>Review checkout</button> ${btn('Quick order','go:/app/quick-order')}</section></div>`}
function checkout(r){const {total,valid}=calc();let deposit=S.payment==='hybrid'?Math.round(total*S.deposit/100):S.payment==='digital'?total:0;return head(r,'Review delivery and payment method. Live settlement is disabled.')+`<div class="split"><section class="card"><h2>Delivery address</h2>${field('Store / shop name','shopname','Al Noor Market')}${field('Governorate','gov','Baghdad')}${field('District / Qadaa','district','Demo district')}${field('Neighborhood / Mahalla','neighborhood','Demo neighborhood')}${field('Nearest landmark','landmark','Demo landmark')}${btn('Use simulated GPS pin','gps','','pin')}<h2 style="margin-top:20px">Payment method</h2>${[['cod','Cash on delivery'],['digital','Digital wallet'],['hybrid','Hybrid deposit + COD'],['credit','Trade credit']].map(x=>`<label class="detailrow"><span>${x[1]}</span><input type="radio" name="payment" value="${x[0]}" ${S.payment===x[0]?'checked':''}></label>`).join('')}${S.payment==='hybrid'?`<div class="field"><label for="deposit">Deposit percentage</label><select id="deposit">${[10,15,20].map(v=>`<option ${v===S.deposit?'selected':''}>${v}</option>`).join('')}</select></div>`:''}</section><section class="card"><h2>Illustrative quotation</h2><div class="detailrow"><span>Goods subtotal</span><strong>${money(total)}</strong></div><div class="detailrow"><span>Digital deposit</span><strong>${money(deposit)}</strong></div><div class="detailrow"><span>${S.payment==='credit'?'Credit obligation':'COD remainder'}</span><strong>${money(total-deposit)}</strong></div><div class="notice">FX rate: not authorized. Taxes and shipping: not calculated. Financial execution remains locked.</div><button class="primary" disabled>${I('lock')} Confirm and pay</button> <button data-action="queue" ${!valid?'disabled':''}>Queue unconfirmed draft</button></section></div>`}
function onboarding(r){const stages=['Phone verification','Storefront & GPS','Document evidence','Review & submit'];const contents=[`${field('Iraqi mobile number','phone','', 'tel','+964 750 000 0000')}<div class="notice">WhatsApp/SMS are not connected. Use synthetic OTP 123456.</div>${field('Demo OTP','otp','','text','123456')}`,`${field('Shop name','shop','','text','Demo shop')}${field('Business category','category','Mini-market')}${field('Governorate','governorate','Erbil')}${field('District / Qadaa','qadaa','')}${field('Nearest landmark','near','')}${btn('Set simulated GPS evidence','gps','','pin')}`,`<div class="notice">Do not upload real identity documents. This prototype uses synthetic evidence only.</div>${['Storefront signboard','Unified national card','Commercial or sector licence'].map(x=>`<div class="detailrow"><span>${x}</span>${pill('Synthetic placeholder')}</div>`).join('')}`,`<h3>Review your application</h3><div class="detailrow"><span>Phone</span>${pill('Simulated')}</div><div class="detailrow"><span>Storefront</span>${pill('Draft')}</div><div class="detailrow"><span>Evidence</span>${pill('Synthetic')}</div><p class="notice">Submission does not grant wholesale access or credit. Command Centre review is required.</p>`];return head(r,'Four-stage onboarding · no real OTP or document upload')+`<div class="split"><section class="card"><div class="steps">${stages.map((_,i)=>`<div class="step ${i<=S.kyc?'on':''}"></div>`).join('')}</div><div class="eyebrow">Step ${S.kyc+1} / 4</div><h2 style="margin-bottom:16px">${stages[S.kyc]}</h2>${contents[S.kyc]}<div class="actions" style="margin-top:16px">${S.kyc>0?btn(t('back'),'kycback'):''}${btn(S.kyc===3?'Submit simulated case':t('next'),'kycnext','primary')}</div></section><section class="card"><h2>Verification stages</h2>${stages.map((x,i)=>`<div class="detailrow"><span>${i+1}. ${x}</span>${pill(i<S.kyc?'Complete':i===S.kyc?'Current':'Pending')}</div>`).join('')}<div class="notice">Commercial access and trade-credit approval are independent decisions.</div></section></div>`}
function kyc(r){if(S.role==='retailer')return onboarding(r);return head(r,'Evidence review, reason codes and independent commercial approval.')+`<div class="split"><section class="card tablecard">${cardhead('KYC queue','Synthetic cases')}<div class="tablewrap"><table><thead><tr><th>Case</th><th>Retailer</th><th>State</th><th></th></tr></thead><tbody>${[['KYC-028','Demo Market 08','Under review'],['KYC-027','Demo Market 07','Pending']].map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${pill(a[2])}</td><td>${btn('Review','kycreview:'+a[0],'quiet')}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>Review controls</h2>${['Phone ownership','Storefront / GPS','Identity evidence','Commercial licence','Risk screening'].map(x=>`<label class="detailrow"><span>${x}</span><input type="checkbox"></label>`).join('')}<div class="notice">Reviewer cannot approve their own assisted onboarding. Evidence URLs must be short-lived and permission-scoped.</div><button disabled>${I('lock')} Approve KYC</button></section></div>`}
function credit(r){return head(r,'Commercial receivables · no lending or electronic wallet functionality.')+`<div class="grid metrics">${metric('Approved limit','10.0M','IQD · example','wallet')}${metric('Receivables','4.5M','IQD · example','file')}${metric('Commitments','1.5M','IQD · example','cart')}${metric('Available credit','4.0M','IQD · example','chart')}</div><div class="split"><section class="card"><h2>Exposure overview</h2><div class="detailrow"><span>Payment terms</span><strong>Net-15</strong></div><div class="detailrow"><span>Overdue balance</span>${pill('Review required')}</div><div style="height:14px;display:flex;background:var(--tint);border-radius:8px;overflow:hidden;margin:20px 0"><div style="width:45%;background:#10413f"></div><div style="width:15%;background:#c68b36"></div></div><div class="legend">Receivables 45% · commitments 15% · available 40%</div><div class="notice">Current exposure is always calculated by the authoritative server. No actual balance is shown.</div></section><section class="card"><h2>${S.role==='command'?'Credit facility controls':'Payment schedule'}</h2>${field(S.role==='command'?'Proposed limit (IQD)':'Illustrative installment','limit','10000000','number')}${field('Reason / reference','reason','')}<button disabled>${I('lock')} ${S.role==='command'?'Submit for approval':'Make payment'}</button><p class="notice">Runtime and legal gates remain closed.</p></section></div>`}
function cod(r){return head(r,'Cash custody, proof of collection and independent reconciliation.')+`<div class="split"><section class="card"><h2>Collection session COD-018</h2><div class="detailrow"><span>Expected cash</span><strong>${money(408000)}</strong></div>${field('Actual cash (IQD)','actual','400000','number')}<div class="detailrow"><span>Variance</span><strong id="variance" style="color:var(--danger)">${money(-8000)}</strong></div>${field('Variance reason','variance-reason','','text','Required if nonzero')}<div class="notice">Cash receipts and settlement records are not posted by this prototype.</div><button disabled>${I('lock')} Submit reconciliation</button></section><section class="card"><h2>Custody history</h2>${['Delivered invoice INV-1046','Driver custody recorded','Cash handover pending','Independent review required'].map((x,i)=>`<div class="detailrow"><span>${x}</span>${pill(i<2?'Sample':'Pending')}</div>`).join('')}</section></div>`}
function ledger(r){return head(r,'Double-entry accounting · immutable posted journals · financial gate closed.')+`<div class="split"><section class="card tablecard">${cardhead('Journal draft JRN-018','Source: synthetic delivered invoice')}<div class="tablewrap"><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody><tr><td>Accounts receivable</td><td>${money(480000)}</td><td>—</td></tr><tr><td>Sales revenue</td><td>—</td><td>${money(480000)}</td></tr></tbody></table></div><div class="tablefoot"><span>Balanced · example only</span><span>Difference 0 IQD</span></div></section><section class="card"><h2>Posting prerequisites</h2>${['Active policy','Verified source evidence','Open accounting period','Independent approval','Fresh MFA','Database acceptance'].map(x=>`<div class="detailrow"><span>${x}</span>${pill('Pending')}</div>`).join('')}<button disabled>${I('lock')} Post journal</button></section></div>`}
function health(r){return head(r,'Deployment and financial acceptance status — source package not connected.')+`<div class="grid quickgrid">${['PostgreSQL migration execution','Prisma compiler validation','Concurrent stock and credit tests','Payment provider certification','External audit anchoring','Production deployment'].map(x=>`<section class="card"><h3>${x}</h3>${pill('Pending')}</section>`).join('')}</div><div class="notice">No live infrastructure telemetry is available. Phase 3 runtime gates are preserved.</div>`}
function fieldHome(r){const driver=S.role==='driver';return head(r,driver?'Assigned delivery stops and proof of receipt.':'Assigned visits, assisted ordering and customer follow-up.')+`<section class="card"><h2>Today's synthetic ${driver?'delivery':'visit'} schedule</h2>${[['09:00','Demo Shop A','Erbil Central'],['11:00','Demo Shop B','Erbil North'],['14:00','Demo Shop C','Erbil South']].map(a=>`<div class="detailrow"><span><strong>${a[0]} · ${a[1]}</strong><br><small>${a[2]}</small></span>${btn(driver?'Proof of delivery':'Check in',driver?'go:/driver/proof':'go:/field/check-in')}</div>`).join('')}</section>`}
function checkin(r){return head(r,'Location evidence is consent-bound and restricted to assigned visits.')+`<section class="card" style="max-width:650px"><h2>Demo Shop A</h2>${btn('Use simulated coordinates','gps','','pin')}<p id="gps-result" class="notice">No real location requested.</p>${field('Visit notes','notes','')}<label class="detailrow"><span>Customer consent recorded (demo)</span><input id="consent" type="checkbox"></label>${btn('Queue visit draft','visit','primary')}</section>`}
function proof(r){return head(r,'Delivery evidence draft · no authoritative shipment state change.')+`<section class="card" style="max-width:650px"><h2>Shipment SHP-105</h2>${field('Accepted cartons','accepted','20','number')}${field('Returned cartons','returned','0','number')}${field('Cash collected (IQD)','cash','408000','number')}<div class="notice">Customer signature and evidence use placeholders only.</div>${btn('Queue proof draft','visit','primary')} <button disabled>${I('lock')} Confirm delivery</button></section>`}
function scan(r){return head(r,'Barcode lookup · manual entry for prototype, camera adapter pending.')+`<section class="card" style="max-width:600px"><div class="visual" style="padding:24px;text-align:center;color:var(--brand)">${I('scan',80)}</div>${field('Barcode','barcode','','text','6280000000011')}${btn('Find product','scan','primary')}<div class="notice">Use 6280000000011 for a sample match. No camera permission is requested.</div></section>`}
function sync(r){return head(r,'Queued drafts are local and never accepted orders.',btn(S.offline?t('offline'):t('online'),'offline','','sync'))+`<section class="card">${cardhead('Operation queue','In-memory simulation · browser reload clears drafts',btn('Simulate reconnect','reconnect'))}${S.queue.length?S.queue.map(q=>`<div class="detailrow"><span>${esc(q.id)}<br><small>${esc(q.kind)}</small></span>${pill(q.state)}</div>`).join(''):'<div class="empty">No queued drafts.</div>'}<div class="notice">Reconnection requires reauthentication, server requote, stock and credit validation. The prototype cannot commit an order.</div></section>`}
function orderdetail(r){return head(r,'Order lifecycle and independent payment / fulfillment states.')+`<section class="card"><h2>ORD-1048</h2>${['Commercial: accepted (sample)','Payment: deposit pending','Inventory: not reserved','Shipment: planned','Accounting: unposted'].map(x=>`<div class="detailrow">${x}</div>`).join('')}<div class="notice">All status labels are independent; no order is actually accepted or posted.</div>${btn('Create reorder draft','reorder','primary')}</section>`}
const screens={dashboard,retailhome,public:publicHome,shop,catalog:productTable,quick,cart,checkout,orders:r=>head(r,'Scoped order history and fulfillment status.')+ordersTable(true),orderdetail,kyc,onboarding,credit,cod,ledger,health,field:fieldHome,checkin,proof,scan,sync};
function drawer(){const d=S.drawer,r=rnow();let body='';if(d.type==='generic'){let fields=r.fields.length?r.fields:['Reference','Status'];let record=d.id==='DEMO-001'?{id:d.id,values:r.sample.length?r.sample:['Demo record','Draft']}:(S.edits[r.path]||[]).find(x=>x.id===d.id);body=`<div class="eyebrow">${esc(r.resource)}</div>${fields.map((f,i)=>field(f,'edit-'+i,record?.values[i]||'')).join('')}<div class="notice">Expected revision: ${record?.version||1}. Local draft only; production uses If-Match and RBAC.</div>${r.mutable?`<div class="actions">${btn(t('save'),'savegeneric','primary')}${d.id?btn(S.archived[r.path+'|'+d.id]?'Restore sample':'Archive sample','archive'):''}</div>`:`<button disabled>${I('lock')} Protected record</button>`}`;}else if(d.type==='product'){const p=PRODUCTS.find(x=>x.sku===d.id);body=`${field('SKU','p-sku',p?.sku||'')}${['English','Arabic','Sorani'].map((l,i)=>field(l+' title','p-'+i,p?.name[i]||'')).join('')}${field('MOQ','p-moq',p?.moq||1,'number')}${field('Reference price (IQD)','p-price',p?.price||0,'number')}<div class="notice">Published packaging and prices require effective-dated revisions. Product editor demonstrates layout only.</div><button disabled>${I('lock')} Publish SKU</button>`;}else if(d.type==='kyc'){body=`<div class="eyebrow">${d.id}</div><h3>Evidence review</h3>${['Unified national card','Storefront photo','Commercial licence'].map(x=>`<div class="detailrow"><span>${x}</span>${pill('Placeholder')}</div>`).join('')}${field('Review reason','review-reason','')}<div class="notice">Protected files are never included in sample export. Approval requires a trusted reviewer and server transition.</div><button disabled>Approve</button> <button disabled>Request re-upload</button> <button disabled>Reject</button>`;}else{let o=ORDERS.find(x=>x[0]===d.id);body=`<h3>${d.id}</h3>${o?`<div class="detailrow"><span>Retailer</span><strong>${o[1]}</strong></div><div class="detailrow"><span>Amount</span><strong>${money(o[3])}</strong></div><div class="detailrow"><span>Shipment</span>${pill(o[4])}</div>`:''}<div class="notice">Amend, cancel and refund require protected server commands.</div>${S.role==='retailer'?btn('Reorder draft','reorder','primary'):'<button disabled>Amend order</button>'}`;}return `<div class="overlay" data-action="closeoutside"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="cardhead"><h2 id="drawer-title">${t('details')}</h2><button class="icon" aria-label="${t('close')}" data-action="close">${I('x')}</button></div>${body}</section></div>`}
function palette(){if(S.modal==='preferences')return preferences();return `<div class="overlay" data-action="closeoutside"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="palette-title"><div class="cardhead"><h2 id="palette-title">${t('search')}</h2><button class="icon" data-action="close" aria-label="${t('close')}">${I('x')}</button></div><input id="palette-query" type="search" placeholder="Search current workspace…" aria-label="Search current workspace"><div id="palette-list">${ROUTES.filter(r=>r.role===S.role).map(nav).join('')}</div></section></div>`}
let timer;function toast(msg){const el=$('#toast');el.textContent=L(msg);el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),3500)}
function updateFilter(v){const start=$('#filter')?.selectionStart;S.filter=v;render();let f=$('#filter');if(f){f.focus();try{f.setSelectionRange(start,start)}catch{}}}
function openDrawer(type,id){rememberFocus();S.drawer={type,id};render();$('.drawer button')?.focus()}
function queue(kind='Order draft'){S.queue.push({id:'LOCAL-'+String(S.queue.length+1).padStart(3,'0'),kind,state:'Pending sync',lines:kind.includes('order')||kind.includes('Order')?calc().lines.map(x=>({sku:x.sku,quantity:x.q})):[],evidence:kind.includes('proof')?Object.fromEntries(['accepted','returned','cash'].map(k=>[k,$('#'+k)?.value||''])):undefined});toast('Draft queued locally; no order committed.');render()}
function sampleExport(){let r=rnow();let values=r.sample.length?r.sample:['Synthetic sample','No live connection'];let fields=r.fields.length?r.fields:['Reference','Status'];let csv=[fields,values].map(row=>row.map(x=>'"'+String(x).replace(/^([=+\-@])/,'\'$1').replaceAll('"','""')+'"').join(',')).join('\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let a=document.createElement('a');a.href=url;a.download='synthetic-sample.csv';a.click();URL.revokeObjectURL(url);toast('Synthetic sample exported.')}
function action(a){let [k,...rest]=a.split(':'),v=rest.join(':');switch(k){case'go':go(v);break;case'jumpsummary':$('#draft-summary')?.scrollIntoView({block:'start'});break;case'menu':rememberFocus();S.menu=!S.menu;render();break;case'preferences':rememberFocus();S.modal='preferences';render();$('.modal button')?.focus();break;case'sort':S.sort=S.sort===v?'-'+v:v;render();break;case'clearfilters':S.filter='';S.status='All';S.sort='';render();break;case'theme':S.theme=S.theme==='light'?'dark':'light';render();document.querySelector(S.modal?'.modal [data-action=theme]':'.topbar [data-action=theme]')?.focus();break;case'digits':S.digits=!S.digits;render();document.querySelector(S.modal?'.modal [data-action=digits]':'.topbar [data-action=digits]')?.focus();break;case'palette':rememberFocus();S.modal=true;render();$('#palette-query')?.focus();break;case'close':{const wasOpen=S.drawer||S.modal||S.menu;S.drawer=null;S.modal=false;S.menu=false;render();if(wasOpen)restoreFocus();break;}case'export':sampleExport();break;case'locked':toast('Release gates are locked. No live operation executed.');break;case'orders':go(S.role==='supplier'?'/supplier/orders':S.role==='retailer'?'/app/orders':'/command/orders');break;case'order':openDrawer('order',v);break;case'generic':openDrawer('generic',v);break;case'create':openDrawer('generic','');break;case'product':openDrawer('product',v);break;case'productnew':openDrawer('product','');break;case'kycreview':openDrawer('kyc',v);break;case'savegeneric':{let r=rnow();if(!r.mutable)return;let fields=r.fields.length?r.fields:['Reference','Status'];let values=fields.map((_,i)=>$('#edit-'+i).value.trim());if(values.some(x=>!x)){toast('Complete all fields.');return}let id=S.drawer.id||'DRAFT-'+Date.now();let rows=S.edits[r.path]||[];let old=rows.find(x=>x.id===id);if(id==='DEMO-001'){toast('Seed record is read-only; create a draft instead.');return}S.edits[r.path]=[...rows.filter(x=>x.id!==id),{id,values,version:(old?.version||0)+1}];S.drawer=null;render();toast('Local draft saved.');break}case'archive':{let key=S.path+'|'+S.drawer.id;S.archived[key]=!S.archived[key];S.drawer=null;render();toast('Sample archive state changed.');break}case'verifytoggle':if(S.role==='public'){toast('Public preview always hides prices.');break}S.verified=!S.verified;render();break;case'add':{let p=PRODUCTS.find(x=>x.sku===v);if(!p||!S.verified||S.role==='public')return;S.cart[v]=(S.cart[v]||0)+p.moq;render();toast('Sample quantity added.');break}case'offline':S.offline=!S.offline;render();break;case'paste':{let lines=$('#paste').value.trim().split(/\n/);let count=0;for(let line of lines){let [sku,q]=line.split(/[\t,;]/);if(PRODUCTS.some(p=>p.sku===sku)&&Number.isInteger(Number(q))&&Number(q)>=0&&Number(q)<=10000){S.cart[sku]=Number(q);count++}}render();toast(`${count} sample rows applied.`);break}case'queue':if((S.role==='retailer'&&S.verified||S.role==='field')&&calc().valid)queue(S.role==='field'?'Proxy order draft':'Order draft');else toast('Correct quantities and MOQ.');break;case'visit':if(S.role==='driver'&&S.path==='/driver/proof'&&(['accepted','returned','cash'].some(id=>!$('#'+id).value.trim()||!Number.isFinite(Number($('#'+id).value))||Number($('#'+id).value)<0)||!Number.isInteger(Number($('#accepted').value))||!Number.isInteger(Number($('#returned').value))||Number($('#accepted').value)+Number($('#returned').value)!==20||!Number.isInteger(Number($('#cash').value))||Number($('#cash').value)>408000)){toast('Check delivery quantities and cash amount.');break}if(S.role==='field'&&!$('#consent')?.checked){toast('Consent is required.');break}queue(S.role==='driver'?'Delivery proof draft':'Visit evidence draft');break;case'reconnect':S.offline=false;S.queue.forEach(q=>q.state=q.kind.toLowerCase().includes('order')?'Requote required':'Evidence review required');render();toast('Simulated reconnect: server validation still required.');break;case'gps':{let e=$('#gps-result');if(e)e.textContent='Synthetic pin recorded; no real GPS requested.';toast('Synthetic GPS only.');break}case'kycback':S.kyc=Math.max(0,S.kyc-1);render();break;case'kycnext':if(S.kyc===0&&(normalizeDigits($('#otp')?.value)!=='123456'||!/^\+964\s?7[0-9\s]{9,12}$/.test(normalizeDigits($('#phone')?.value||'')))){toast('Use a sample +964 mobile number and OTP 123456.');break}if(S.kyc===1&&(!$('#shop')?.value.trim()||!$('#qadaa')?.value.trim()||!$('#near')?.value.trim())){toast('Enter shop, district and landmark.');break}if(S.kyc===3){toast('Simulated application submitted; no approval granted.');S.kyc=0;for(const k of Object.keys(S.formValues||{}))if(k.startsWith(S.path+'|'))delete S.formValues[k];render()}else{S.kyc++;render()}break;case'scan':{let p=PRODUCTS.find(x=>x.barcode===normalizeDigits($('#barcode').value.trim()));if(!p){toast('No matching sample barcode.');break}go('/app/catalog');S.filter=p.sku;render();break}case'reorder':S.cart['BEV-001']=20;go('/app/cart');break;}}
app.addEventListener('click',e=>{let a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return}let b=e.target.closest('[data-action]');if(!b||b.disabled)return;if(b.dataset.action==='closeoutside'){if(e.target===b)action('close');return}action(b.dataset.action)});

function normalizeDigits(s){return String(s??'').replace(/[٠-٩۰-۹]/g,d=>String(d.charCodeAt(0)-(d.charCodeAt(0)>=1776?1776:1632)))}
function normalizeSearch(s){return normalizeDigits(s).normalize('NFKC').toLowerCase().replace(/[\u064b-\u065f\u0670ـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ك/g,'ک').replace(/ي/g,'ی').replace(/\s+/g,' ').trim()}
